harray="4 3" stroke-width="0.9" style="" width="40" x="250" y="55"></rect><rect data-bind-style='[["opacity", "sp"]]' fill="none" height="50" stroke="#6F7782" stroke-dasharray="4 3" stroke-width="0.9" style="" width="30" x="340" y="120"></rect><rect data-bind-style='[["opacity", "sp"]]' fill="none" height="80" stroke="#6F7782" stroke-dasharray="4 3" stroke-width="0.9" style="" width="110" x="40" y="170"></rect><g data-bind-css="e0" style=""><rect fill="#E4E7EB" height="60" rx="2" stroke="#16181C" stroke-width="1.1" width="110" x="40" y="50"></rect><text fill="#16181C" font-size="7.5" font-weight="700" text-anchor="middle" x="95.0" y="83.0">AHU-1</text></g><g data-bind-css="e1" style=""><rect fill="#E4E7EB" height="30" rx="2" stroke="#16181C" stroke-width="1.1" width="40" x="190" y="55"></rect><text fill="#16181C" font-size="7.5" font-weight="700" text-anchor="middle" x="210.0" y="73.0">CHP-1</text></g><g data-bind-css="e2" style=""><rect fill="#E4E7EB" height="30" rx="2" stroke="#16181C" stroke-width="1.1" width="40" x="250" y="55"></rect><text fill="#16181C" font-size="7.5" font-weight="700" text-anchor="middle" x="270.0" y="73.0">CHP-2</text></g><g data-bind-css="e3" style=""><rect fill="#E4E7EB" height="50" rx="2" stroke="#16181C" stroke-width="1.1" width="30" x="340" y="120"></rect><text fill="#16181C" font-size="7.5" font-weight="700" text-anchor="middle" x="355.0" y="148.0">DB-B1</text></g><g data-bind-css="e4" style=""><rect fill="#E4E7EB" height="80" rx="2" stroke="#16181C" stroke-width="1.1" width="110" x="40" y="170"></rect><text fill="#16181C" font-size="7.5" font-weight="700" text-anchor="middle" x="95.0" y="213.0">TANK</text></g></svg><div style="position: absolute; right: 10px; top: 10px; width: 190px; padding: 8px 10px; border-radius: 6px; background: #FFFFFF; box-shadow: 0 0 0 1px #C9CED6; font-size: 10.5px;"><div style="font-weight: 600; color: #16181C; padding-bottom: 3px;">Placement checks</div><div data-bind-style='[["opacity", "k0"]]' style="dis <script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var stage = root.querySelector('.bimac-stage');
  function fit() { stage.style.transform = 'scale(' + (root.clientWidth / 1280) + ')'; }
  fit();
  if (window.ResizeObserver) new ResizeObserver(fit).observe(root); else window.addEventListener('resize', fit);
  var DCLogic = function () {};


class Component extends DCLogic {
componentDidMount() {
  var rm = false;
  try { rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  if (rm) { this.setState({ p: 88 }); return; }
  var t0 = Date.now(), self = this;
  this._iv = setInterval(function () { self.setState({ p: ((Date.now() - t0) % 15000) / 150 }); }, 40);
}
componentWillUnmount() { if (this._iv) clearInterval(this._iv); }
renderVals() {
  var p = (this.state && typeof this.state.p === 'number') ? this.state.p : 88;
  function lin(k) {
    if (p <= k[0][0]) return k[0][1];
    for (var i = 1; i < k.length; i++) if (p <= k[i][0]) { var a = k[i-1], b = k[i], f = (p - a[0]) / (b[0] - a[0]); f = 1 - Math.pow(1 - f, 3); return a[1] + (b[1] - a[1]) * f; }
    return k[k.length-1][1];
  }
  var out = p < 94 ? 1 : Math.max(0, 1 - (p - 94) / 6);
  var v = {};
  function phases(ph) { for (var i = 0; i < ph.length; i++) { v['on'+i] = (p >= ph[i][0] && p < ph[i][1]) ? 1 : 0; v['done'+i] = (p >= ph[i][1] && p < 97) ? out : 0; } }

  phases([[0,14],[14,40],[40,62],[62,80]]);
  v.sp = lin([[2,0],[8,1],[40,1],[46,0]]) * out;
  for (var i = 0; i < 5; i++) { var f = lin([[15 + i * 4, 0],[18 + i * 4, 1]]); var dx = (i == 2) ? 8 * lin([[62,0],[66,1]]) : 0; v['e'+i] = 'opacity: ' + (f * out).toFixed(3) + '; transform: translate(' + (-dx).toFixed(1) + 'px,' + (-10 * (1 - f)).toFixed(1) + 'px);'; }
  v.cl = lin([[42,0],[48,1]]) * out;
  var bad = (p >= 48 && p < 64);
  for (var i = 0; i < 5; i++) { var red = bad && (i == 1 || i == 2); v['cf'+i] = red ? 'rgba(192,57,43,0.12)' : 'rgba(30,127,79,0.08)'; v['cs'+i] = red ? '#C0392B' : '#1E7F4F'; }
  v.cc = bad ? 'CHP-1/2 overlap' : (p >= 64 ? 'all met' : '—');
  v.k0 = p >= 36 ? out : 0.25 * out; v.k1 = p >= 48 ? out : 0.25 * out; v.k2 = p >= 56 ? out : 0.25 * out; v.k3 = p >= 68 ? out : 0.25 * out;
  v.fin = (p >= 72 && p < 97) ? out : 0;

  return { v: v };
}
}


  var comp = new Component();
  function get(o, path) { return path.split('.').reduce(function (a, k) { return a == null ? a : a[k]; }, o); }
  function fill(tpl, v) { return tpl.split('[[').map(function (part, n) { if (n === 0) return part; var k = part.indexOf(']]'); var r = get(v, part.slice(0, k)); return (r == null ? '' : r) + part.slice(k + 2); }).join(''); }
  var cssEls = root.querySelectorAll('[data-bind-css]'), txtEls = root.querySelectorAll('[data-bind-text]');
  var styleMap = Array.prototype.map.call(root.querySelectorAll('[data-bind-style]'), function (el) { return [el, JSON.parse(el.getAttribute('data-bind-style'))]; });
  var ATTRS = ["fill", "stroke"], attrMap = [];
  ATTRS.forEach(function (a) { root.querySelectorAll('[data-bind-' + a + ']').forEach(function (el) { attrMap.push([el, a, JSON.parse(el.getAttribute('data-bind-' + a))]); }); });
  function render(p) {
    comp.state = { p: p };
    var v = comp.renderVals().v;
    cssEls.forEach(function (el) { el.style.cssText = get(v, el.getAttribute('data-bind-css')); });
    styleMap.forEach(function (e) { e[1].forEach(function (pr) { e[0].style.setProperty(pr[0], get(v, pr[1])); }); });
    attrMap.forEach(function (e) { e[0].setAttribute(e[1], fill(e[2], v)); });
    txtEls.forEach(function (el) { el.textContent = get(v, el.getAttribute('data-bind-text')); });
  }
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { render(88); return; }
  var t0 = performance.now(), visible = true;
  if (window.IntersectionObserver) new IntersectionObserver(function (en) { visible = en[0].isIntersecting; }).observe(root);
  function tick(now) { if (visible) render(((now - t0) % 15000) / 15000 * 100); requestAnimationFrame(tick); }
  render(0); requestAnimationFrame(tick);
})();
</script>
