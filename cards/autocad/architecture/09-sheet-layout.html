<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var stage = root.querySelector('.bimac-stage');
  function fit() { stage.style.transform = 'scale(' + (root.clientWidth / 1280) + ')'; }
  fit();
  if (window.ResizeObserver) new ResizeObserver(fit).observe(root); else window.addEventListener('resize', fit);
  var DCLogic = function () {};


class Component extends DCLogic {
componentDidMount() {
  var rm = false;
  try { rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  if (rm) { this.setState({ p: 88 }); return; }
  var t0 = Date.now(), self = this;
  this._iv = setInterval(function () { self.setState({ p: ((Date.now() - t0) % 15000) / 150 }); }, 40);
}
componentWillUnmount() { if (this._iv) clearInterval(this._iv); }
renderVals() {
  var p = (this.state && typeof this.state.p === 'number') ? this.state.p : 88;
  function lin(k) {
    if (p <= k[0][0]) return k[0][1];
    for (var i = 1; i < k.length; i++) if (p <= k[i][0]) { var a = k[i-1], b = k[i], f = (p - a[0]) / (b[0] - a[0]); f = 1 - Math.pow(1 - f, 3); return a[1] + (b[1] - a[1]) * f; }
    return k[k.length-1][1];
  }
  var out = p < 94 ? 1 : Math.max(0, 1 - (p - 94) / 6);
  var v = {};
  function phases(ph) { for (var i = 0; i < ph.length; i++) { v['on'+i] = (p >= ph[i][0] && p < ph[i][1]) ? 1 : 0; v['done'+i] = (p >= ph[i][1] && p < 97) ? out : 0; } }

  phases([[0,20],[20,40],[40,60],[60,80]]);
  var nl = 0;
  for (var i = 0; i < 6; i++) { var f = lin([[2 + i * 2.5, 0],[4 + i * 2.5, 1]]); v['sh'+i] = 'opacity: ' + (f * out).toFixed(3) + '; transform: translateY(' + (10 * (1 - f)).toFixed(1) + 'px);'; if (p >= 4 + i * 2.5) nl++; }
  v.nl = nl; v.tb = lin([[22,0],[27,1]]); v.nm = lin([[30,0],[34,1]]); v.vp = lin([[42,0],[48,1]]); v.rv = lin([[62,0],[66,1]]);
  v.k0 = out; v.k1 = p >= 22 ? out : 0.25 * out; v.k2 = p >= 30 ? out : 0.25 * out; v.k3 = p >= 62 ? out : 0.25 * out; v.k4 = p >= 42 ? out : 0.25 * out;
  v.fin = (p >= 72 && p < 97) ? out : 0;

  return { v: v };
}
}


  var comp = new Component();
  function get(o, path) { return path.split('.').reduce(function (a, k) { return a == null ? a : a[k]; }, o); }
  function fill(tpl, v) { return tpl.split('[[').map(function (part, n) { if (n === 0) return part; var k = part.indexOf(']]'); var r = get(v, part.slice(0, k)); return (r == null ? '' : r) + part.slice(k + 2); }).join(''); }
  var cssEls = root.querySelectorAll('[data-bind-css]'), txtEls = root.querySelectorAll('[data-bind-text]');
  var styleMap = Array.prototype.map.call(root.querySelectorAll('[data-bind-style]'), function (el) { return [el, JSON.parse(el.getAttribute('data-bind-style'))]; });
  var ATTRS = [], attrMap = [];
  ATTRS.forEach(function (a) { root.querySelectorAll('[data-bind-' + a + ']').forEach(function (el) { attrMap.push([el, a, JSON.parse(el.getAttribute('data-bind-' + a))]); }); });
  function render(p) {
    comp.state = { p: p };
    var v = comp.renderVals().v;
    cssEls.forEach(function (el) { el.style.cssText = get(v, el.getAttribute('data-bind-css')); });
    styleMap.forEach(function (e) { e[1].forEach(function (pr) { e[0].style.setProperty(pr[0], get(v, pr[1])); }); });
    attrMap.forEach(function (e) { e[0].setAttribute(e[1], fill(e[2], v)); });
    txtEls.forEach(function (el) { el.textContent = get(v, el.getAttribute('data-bind-text')); });
  }
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { render(88); return; }
  var t0 = performance.now(), visible = true;
  if (window.IntersectionObserver) new IntersectionObserver(function (en) { visible = en[0].isIntersecting; }).observe(root);
  function tick(now) { if (visible) render(((now - t0) % 15000) / 15000 * 100); requestAnimationFrame(tick); }
  render(0); requestAnimationFrame(tick);
