[vc0]]"' data-bind-style='[["opacity", "vl0"]]' fill="" font-size="7" font-weight="700" style="" x="43" y="63">Layer 0</text></g><g><circle cx="200" cy="60" data-bind-stroke='"[[vc1]]"' fill="none" r="10" stroke="" stroke-width="1.6"></circle><text data-bind-fill='"[[vc1]]"' data-bind-style='[["opacity", "vl1"]]' fill="" font-size="7" font-weight="700" style="" x="213" y="63">Text: Arial</text></g><g><circle cx="75" cy="140" data-bind-stroke='"[[vc2]]"' fill="none" r="10" stroke="" stroke-width="1.6"></circle><text data-bind-fill='"[[vc2]]"' data-bind-style='[["opacity", "vl2"]]' fill="" font-size="7" font-weight="700" style="" x="88" y="143">Block not standard</text></g><g><circle cx="230" cy="150" data-bind-stroke='"[[vc3]]"' fill="none" r="10" stroke="" stroke-width="1.6"></circle><text data-bind-fill='"[[vc3]]"' data-bind-style='[["opacity", "vl3"]]' fill="" font-size="7" font-weight="700" style="" x="243" y="153">Dim style</text></g><g><circle cx="140" cy="30" data-bind-stroke='"[[vc4]]"' fill="none" r="10" stroke="" stroke-width="1.6"></circle><text data-bind-fill='"[[vc4]]"' data-bind-style='[["opacity", "vl4"]]' fill="" font-size="7" font-weight="700" style="" x="153" y="33">LTSCALE</text></g></svg><div style="position: absolute; right: 10px; top: 10px; width: 206px; padding: 8px 10px; border-radius: 6px; background: #FFFFFF; box-shadow: 0 0 0 1px #C9CED6; font-size: 10.5px; color: #2B2F36;"><div style="font-weight: 600; color: #16181C; padding-bottom: 3px;">Standards check · BIMAC_ARCH.dws</div><div data-bind-style='[["opacity", "k0"]]' style="display: flex; justify-content: space-between; min-height: 20px; align-items: center; border-top: 1px solid #EEF0F2;"><div style="color: #4A515C;">Layers</div><div style="font-weight: 700; color: #16181C;"><span data-bind-text="a"></span></div></div><div data-bind-style='[["opacity", "k1"]]' style="display: flex; justify-content: space-between; min-height: 20px; align-items: center; border-top: 1px solid #EEF0F2;"><div style="color: #4A515C;">Text styles</div><div style="font-weight: 700; color: #16181C;"><span data-bind-text="b"></span></div></div><div data-bind-style='[["opacity", "k2"]]' style="display: flex; justify-content: space-between; min-height: 20px; align-items: center; border-top: 1px solid #EEF0F2;"><div style="color: #4A515C;">Blocks</div><div style="font-weight: 700; color: #16181C;"><span data-bind-text="c"></span></div></div><div data-bind-style='[["opacity", "k3"]]' style="display: flex; justify-content: space-between; min-height: 20px; align-items: center; border-top: 1px solid #EEF0F2;"><div style="color: #4A515C;">Dim styles</div><div style="font-weight: 700; color: #16181C;"><span data-bind-text="d"></span></div></div><div data-bind-style='[["opacity", "k4"]]' style="display: flex; justify-content: space-between; min-height: 20px; align-items: center; border-top: 1px solid #EEF0F2;"><div style="color: #4A515C;">Linetype scale</div><div style="font-weight: 700; color: #16181C;"><span data-bind-text="e"></span></div></div></div><div data-bind-style='[["opacity", "fin"]]' style="position: absolute; left: 12px; bottom: 10px; display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: #E3F4EA; color: #1E7F4F; font-size: 11px; font-weight: 600;"><svg aria-hidden="true" fill="none" height="13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" viewBox="0 0 24 24" width="13"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>5 violations found, fixed and reported</span></div>

<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var stage = root.querySelector('.bimac-stage');
  function fit() { stage.style.transform = 'scale(' + (root.clientWidth / 1280) + ')'; }
  fit();
  if (window.ResizeObserver) new ResizeObserver(fit).observe(root); else window.addEventListener('resize', fit);
  var DCLogic = function () {};


class Component extends DCLogic {
componentDidMount() {
  var rm = false;
  try { rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  if (rm) { this.setState({ p: 88 }); return; }
  var t0 = Date.now(), self = this;
  this._iv = setInterval(function () { self.setState({ p: ((Date.now() - t0) % 15000) / 150 }); }, 40);
}
componentWillUnmount() { if (this._iv) clearInterval(this._iv); }
renderVals() {
  var p = (this.state && typeof this.state.p === 'number') ? this.state.p : 88;
  function lin(k) {
    if (p <= k[0][0]) return k[0][1];
    for (var i = 1; i < k.length; i++) if (p <= k[i][0]) { var a = k[i-1], b = k[i], f = (p - a[0]) / (b[0] - a[0]); f = 1 - Math.pow(1 - f, 3); return a[1] + (b[1] - a[1]) * f; }
    return k[k.length-1][1];
  }
  var out = p < 94 ? 1 : Math.max(0, 1 - (p - 94) / 6);
  var v = {};
  function phases(ph) { for (var i = 0; i < ph.length; i++) { v['on'+i] = (p >= ph[i][0] && p < ph[i][1]) ? 1 : 0; v['done'+i] = (p >= ph[i][1] && p < 97) ? out : 0; } }

  phases([[0,12],[12,40],[40,66],[66,80]]);
  var fx = [44, 48, 52, 56, 60];
  for (var i = 0; i < 5; i++) {
    var found = p >= 14 + i * 4.5;
    v['vc'+i] = !found ? 'rgba(0,0,0,0)' : (p >= fx[i] ? '#3DDC84' : '#FF5A55');
    v['vl'+i] = (found && p < 97) ? out : 0;
  }
  var st = function (i, bad) { return p < 14 + i * 4.5 ? '—' : (p >= fx[i] ? '✓ fixed' : bad); };
  v.a = st(0, '1 on layer 0'); v.b = st(1, '1 wrong font'); v.c = st(2, '1 non-standard'); v.d = st(3, '1 override'); v.e = st(4, '1 mismatch');
  v.k0 = out; v.k1 = out; v.k2 = out; v.k3 = out; v.k4 = out;
  v.fin = (p >= 70 && p < 97) ? out : 0;

  return { v: v };
}
}


  var comp = new Component();
  function get(o, path) { return path.split('.').reduce(function (a, k) { return a == null ? a : a[k]; }, o); }
  function fill(tpl, v) { return tpl.split('[[').map(function (part, n) { if (n === 0) return part; var k = part.indexOf(']]'); var r = get(v, part.slice(0, k)); return (r == null ? '' : r) + part.slice(k + 2); }).join(''); }
  var cssEls = root.querySelectorAll('[data-bind-css]'), txtEls = root.querySelectorAll('[data-bind-text]');
  var styleMap = Array.prototype.map.call(root.querySelectorAll('[data-bind-style]'), function (el) { return [el, JSON.parse(el.getAttribute('data-bind-style'))]; });
  var ATTRS = ["fill", "stroke"], attrMap = [];
  ATTRS.forEach(function (a) { root.querySelectorAll('[data-bind-' + a + ']').forEach(function (el) { attrMap.push([el, a, JSON.parse(el.getAttribute('data-bind-' + a))]); }); });
  function render(p) {
    comp.state = { p: p };
    var v = comp.renderVals().v;
    cssEls.forEach(function (el) { el.style.cssText = get(v, el.getAttribute('data-bind-css')); });
    styleMap.forEach(function (e) { e[1].forEach(function (pr) { e[0].style.setProperty(pr[0], get(v, pr[1])); }); });
    attrMap.forEach(function (e) { e[0].setAttribute(e[1], fill(e[2], v)); });
    txtEls.forEach(function (el) { el.textContent = get(v, el.getAttribute('data-bind-text')); });
  }
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { render(88); return; }
  var t0 = performance.now(), visible = true;
  if (window.IntersectionObserver) new IntersectionObserver(function (en) { visible = en[0].isIntersecting; }).observe(root);
  function tick(now) { if (visible) render(((now - t0) % 15000) / 15000 * 100); requestAnimationFrame(tick); }
  render(0); requestAnimationFrame(tick);
})();
</script>
