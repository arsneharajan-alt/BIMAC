tyle="font-weight: 600; color: #16181C; padding-bottom: 3px;">Schematic from drawings</div><div data-bind-style='[["opacity", "k0"]]' style="display: flex; justify-content: space-between; min-height: 20px; align-items: center; border-top: 1px solid #EEF0F2;"><div style="color: #4A515C;">Plans read</div><div style="font-weight: 700; color: #16181C;"><span data-bind-text="np"></span> / 3</div></div><div data-bind-style='[["opacity", "k1"]]' style="display: flex; justify-content: space-between; min-height: 20px; align-items: center; border-top: 1px solid #EEF0F2;"><div style="color: #4A515C;">Levels</div><div style="font-weight: 700; color: #16181C;">3</div></div><div data-bind-style='[["opacity", "k2"]]' style="display: flex; justify-content: space-between; min-height: 20px; align-items: center; border-top: 1px solid #EEF0F2;"><div style="color: #4A515C;">Boards connected</div><div style="font-weight: 700; color: #16181C;"><span data-bind-text="nd"></span></div></div><div data-bind-style='[["opacity", "k3"]]' style="display: flex; justify-content: space-between; min-height: 20px; align-items: center; border-top: 1px solid #EEF0F2;"><div style="color: #4A515C;">Cable labels</div><div style="font-weight: 700; color: #16181C;"><span data-bind-text="cb"></span></div></div></div><div data-bind-style='[["opacity", "fin"]]' style="position: absolute; left: 12px; bottom: 10px; display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: #E3F4EA; color: #1E7F4F; font-size: 11px; font-weight: 600;"><svg aria-hidden="true" fill="none" height="13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" viewBox="0 0 24 24" width="13"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>Riser schematic generated</span></div>

<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var stage = root.querySelector('.bimac-stage');
  function fit() { stage.style.transform = 'scale(' + (root.clientWidth / 1280) + ')'; }
  fit();
  if (window.ResizeObserver) new ResizeObserver(fit).observe(root); else window.addEventListener('resize', fit);
  var DCLogic = function () {};


class Component extends DCLogic {
componentDidMount() {
  var rm = false;
  try { rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  if (rm) { this.setState({ p: 88 }); return; }
  var t0 = Date.now(), self = this;
  this._iv = setInterval(function () { self.setState({ p: ((Date.now() - t0) % 15000) / 150 }); }, 40);
}
componentWillUnmount() { if (this._iv) clearInterval(this._iv); }
renderVals() {
  var p = (this.state && typeof this.state.p === 'number') ? this.state.p : 88;
  function lin(k) {
    if (p <= k[0][0]) return k[0][1];
    for (var i = 1; i < k.length; i++) if (p <= k[i][0]) { var a = k[i-1], b = k[i], f = (p - a[0]) / (b[0] - a[0]); f = 1 - Math.pow(1 - f, 3); return a[1] + (b[1] - a[1]) * f; }
    return k[k.length-1][1];
  }
  var out = p < 94 ? 1 : Math.max(0, 1 - (p - 94) / 6);
  var v = {};
  function phases(ph) { for (var i = 0; i < ph.length; i++) { v['on'+i] = (p >= ph[i][0] && p < ph[i][1]) ? 1 : 0; v['done'+i] = (p >= ph[i][1] && p < 97) ? out : 0; } }

  phases([[0,16],[16,30],[30,58],[58,80]]);
  var np = 0; for (var i = 0; i < 3; i++) { v['p'+i] = (p >= 2 + i * 4 && p < 6 + i * 4) ? 1 : 0; if (p >= 2 + i * 4) np++; }
  v.np = np; v.lv = lin([[17,0],[22,1]]) * out; v.ms = lin([[30,0],[33,1]]) * out;
  v.ry = (200 - 152 * lin([[33,0],[42,1]])).toFixed(1);
  var nd = 0; for (var i = 0; i < 3; i++) { var a = lin([[40 + i * 5, 0],[43 + i * 5, 1]]); v['d'+i] = a * out; if (a >= 1) nd++; }
  v.nd = nd; v.cl = lin([[60,0],[65,1]]) * out; v.cb = p >= 64 ? 3 : 0;
  v.k0 = out; v.k1 = p >= 22 ? out : 0.25 * out; v.k2 = p >= 42 ? out : 0.25 * out; v.k3 = p >= 64 ? out : 0.25 * out;
  v.fin = (p >= 72 && p < 97) ? out : 0;

  return { v: v };
}
}


  var comp = new Component();
  function get(o, path) { return path.split('.').reduce(function (a, k) { return a == null ? a : a[k]; }, o); }
  function fill(tpl, v) { return tpl.split('[[').map(function (part, n) { if (n === 0) return part; var k = part.indexOf(']]'); var r = get(v, part.slice(0, k)); return (r == null ? '' : r) + part.slice(k + 2); }).join(''); }
  var cssEls = root.querySelectorAll('[data-bind-css]'), txtEls = root.querySelectorAll('[data-bind-text]');
  var styleMap = Array.prototype.map.call(root.querySelectorAll('[data-bind-style]'), function (el) { return [el, JSON.parse(el.getAttribute('data-bind-style'))]; });
  var ATTRS = ["d"], attrMap = [];
  ATTRS.forEach(function (a) { root.querySelectorAll('[data-bind-' + a + ']').forEach(function (el) { attrMap.push([el, a, JSON.parse(el.getAttribute('data-bind-' + a))]); }); });
  function render(p) {
    comp.state = { p: p };
    var v = comp.renderVals().v;
    cssEls.forEach(function (el) { el.style.cssText = get(v, el.getAttribute('data-bind-css')); });
    styleMap.forEach(function (e) { e[1].forEach(function (pr) { e[0].style.setProperty(pr[0], get(v, pr[1])); }); });
    attrMap.forEach(function (e) { e[0].setAttribute(e[1], fill(e[2], v)); });
    txtEls.forEach(function (el) { el.textContent = get(v, el.getAttribute('data-bind-text')); });
  }
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { render(88); return; }
  var t0 = performance.now(), visible = true;
  if (window.IntersectionObserver) new IntersectionObserver(function (en) { visible = en[0].isIntersecting; }).observe(root);
  function tick(now) { if (visible) render(((now - t0) % 15000) / 15000 * 100); requestAnimationFrame(tick); }
  render(0); requestAnimationFrame(tick);
})();
</script>
